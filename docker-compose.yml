version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: wagering-postgres
    environment:
      POSTGRES_DB: wagering
      POSTGRES_USER: wagering
      POSTGRES_PASSWORD: wagering
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wagering -d wagering"]
      interval: 5s
      timeout: 5s
      retries: 5

  localstack:
    image: localstack/localstack:3.5
    container_name: wagering-localstack
    environment:
      SERVICES: sqs
      DEBUG: 1
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    ports:
      - "4566:4566"
      - "4510-4559:4510-4559"
    volumes:
      - localstack_data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wagering-app
    ports:
      - "3000:3000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: wagering
      DB_USER: wagering
      DB_PASSWORD: wagering
      SQS_ENDPOINT: http://localstack:4566
      SQS_QUEUE_URL: http://localstack:4566/000000000000/wager-transactions.fifo
      SQS_DLQ_URL: http://localstack:4566/000000000000/wager-transactions-dlq.fifo
      SQS_OUTBOX_QUEUE_URL: http://localstack:4566/000000000000/wager-events.fifo
      CONSUMER_NAME: wager-worker-1
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    command: bun run src/main.ts

  worker-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wagering-worker-1
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: wagering
      DB_USER: wagering
      DB_PASSWORD: wagering
      SQS_ENDPOINT: http://localstack:4566
      SQS_QUEUE_URL: http://localstack:4566/000000000000/wager-transactions.fifo
      SQS_DLQ_URL: http://localstack:4566/000000000000/wager-transactions-dlq.fifo
      SQS_OUTBOX_QUEUE_URL: http://localstack:4566/000000000000/wager-events.fifo
      CONSUMER_NAME: wager-worker-1
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    command: bun run src/workers.ts

  worker-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wagering-worker-2
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: wagering
      DB_USER: wagering
      DB_PASSWORD: wagering
      SQS_ENDPOINT: http://localstack:4566
      SQS_QUEUE_URL: http://localstack:4566/000000000000/wager-transactions.fifo
      SQS_DLQ_URL: http://localstack:4566/000000000000/wager-transactions-dlq.fifo
      SQS_OUTBOX_QUEUE_URL: http://localstack:4566/000000000000/wager-events.fifo
      CONSUMER_NAME: wager-worker-2
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    command: bun run src/workers.ts

  worker-3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wagering-worker-3
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: wagering
      DB_USER: wagering
      DB_PASSWORD: wagering
      SQS_ENDPOINT: http://localstack:4566
      SQS_QUEUE_URL: http://localstack:4566/000000000000/wager-transactions.fifo
      SQS_DLQ_URL: http://localstack:4566/000000000000/wager-transactions-dlq.fifo
      SQS_OUTBOX_QUEUE_URL: http://localstack:4566/000000000000/wager-events.fifo
      CONSUMER_NAME: wager-worker-3
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    command: bun run src/workers.ts

volumes:
  postgres_data:
  localstack_data: